<!DOCTYPE html>
<html lang="ru">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Мой блог{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header>
        <img
        src="{{ url_for('static', filename='image.jpg') }}"
        alt="Моё изображение"
        class="header-image"
        >
        
        <h1>Мой блог</h1>

        <p>Мои достижения и навыки в веб-разработке</p>

        <nav>
            <a href="/">Главная</a>
            <a href="/notes">Дневник программиста</a>
        </nav>

    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Мой учебный проект</p>
    </footer>

</body>

</html>
